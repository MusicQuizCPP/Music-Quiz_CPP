# The list of filters can be found in this document
# https://github.com/cpplint/cpplint/blob/develop/cpplint.py

# Disable a warning about C++ features that were not in the original
# C++14 specification (and so might not be well-supported).
filter=-build/c++11


# Use `#pragma once`, not the `#ifndef FOO_H` guard.
filter=-build/header_guard
filter=+build/pragma_once


# Set max line length
linelength=200


# Add filters
filter=-legal/copyright
filter=-build/include_order
filter=-build/include_subdir
filter=-whitespace/tab
filter=-whitespace/indent
filter=-whitespace/braces
filter=-whitespace/comments
filter=-whitespace/end_of_line
filter=-whitespace/ending_newline
filter=-readability/namespace
filter=-runtime/references
filter=-runtime/threadsafe_fn
filter=-runtime/indentation_namespace